document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n          <div style=\"font-size:11px;color:#9AA1AB\">{{ projCode }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:#C2C8D0;font-size:11px\">▾<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ projMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div sc-camel-on-click=\"{{ u.closeProjMenu }}\" style=\"position:fixed;inset:0;z-index:30\"><\u002Fdiv>\n          <div style=\"position:absolute;top:100%;left:14px;right:14px;margin-top:4px;background:#fff;border:1px solid #ECEEF1;border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:31;padding:6px;max-height:320px;overflow-y:auto\">\n            <div style=\"font:600 10px 'IBM Plex Sans Thai';letter-spacing:.08em;text-transform:uppercase;color:#9AA1AB;padding:6px 9px 4px\">เลือกโครงการ<\u002Fdiv>\n            <sc-for list=\"{{ projectMenu }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ p.onClick }}\" style=\"{{ p.style }}\" style-hover=\"background:#F4F6F8\">\n                <div style=\"width:8px;height:8px;border-radius:50%;background:#3B5BDB;flex:none;opacity:{{ p.dotOpacity }}\"><\u002Fdiv>\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#9AA1AB\">{{ p.code }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ canCreate }}\" hint-placeholder-val=\"{{ true }}\">\n              <div sc-camel-on-click=\"{{ u.newProject }}\" style=\"display:flex;align-items:center;gap:9px;padding:10px 11px;margin-top:4px;border-top:1px solid #F1F3F5;color:#3B5BDB;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:8px\" style-hover=\"background:#EAEEFC\">\n                <span style=\"font-size:15px;line-height:1\">＋<\u002Fspan> สร้างโครงการใหม่\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"padding:4px 14px 10px;display:flex;gap:6px\">\n      <div sc-camel-on-click=\"{{ u.editCurrentProject }}\" style=\"flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border:1px solid #ECEEF1;border-radius:8px;font-size:12px;font-weight:600;color:#3B5BDB;cursor:pointer;background:#fff\" style-hover=\"background:#EAEEFC;border:1px solid #C2CCE8\">✎ แก้ไข<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ u.deleteCurrentProject }}\" style=\"display:flex;align-items:center;justify-content:center;padding:7px 10px;border:1px solid #ECEEF1;border-radius:8px;font-size:13px;color:#9AA1AB;cursor:pointer;background:#fff\" style-hover=\"background:#FBE9E7;border:1px solid #F1D5D2;color:#D6493B\" title=\"ลบโครงการ\">🗑<\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav style=\"padding:10px 14px;display:flex;flex-direction:column;gap:2px;flex:1\">\n      <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"5\">\n        <div sc-camel-on-click=\"{{ n.onClick }}\" style=\"{{ n.style }}\" style-hover=\"background:#F4F6F8\">\n          <span style=\"width:18px;text-align:center;font-size:14px\">{{ n.icon }}<\u002Fspan>\n          <span style=\"flex:1\">{{ n.label }}<\u002Fspan>\n          <sc-if value=\"{{ n.badge }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:#FBE9E7;color:#D6493B;font:600 10px 'IBM Plex Mono';padding:1px 6px;border-radius:20px\">{{ n.badge }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"padding:8px 14px 10px\">\n      <div style=\"display:flex;align-items:center;gap:7px;padding:7px 9px;background:#F3FAF6;border-radius:8px;font-size:11px;color:#18935A\">\n        <span style=\"width:6px;height:6px;border-radius:50%;background:#18935A;flex:none\"><\u002Fspan>\n        <span style=\"flex:1;font-weight:500\">เชื่อมต่อฐานข้อมูลกลาง · ทุกคนเห็นตรงกัน<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:14px;border-top:1px solid #F1F3F5;display:flex;align-items:center;gap:10px\">\n      <div style=\"width:32px;height:32px;border-radius:50%;background:#1B1F27;color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none\">{{ me.initial }}<\u002Fdiv>\n      <div style=\"min-width:0;flex:1\">\n        <div style=\"font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ me.name }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:#9AA1AB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ me.roleLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ u.signOut }}\" title=\"ออกจากระบบ\" style=\"color:#9AA1AB;cursor:pointer;font-size:13px;padding:4px 7px;border-radius:7px\" style-hover=\"background:#FBE9E7;color:#D6493B\">⏻<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============ MAIN ============ -->\n  <div class=\"app-col\" style=\"flex:1;display:flex;flex-direction:column;min-width:0;height:100%\">\n\n    <!-- topbar -->\n    <header class=\"app-top\" style=\"min-height:64px;flex:none;background:#FFFFFF;border-bottom:1px solid #ECEEF1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 28px\">\n      <div style=\"flex:1;min-width:180px\">\n        <div style=\"font-size:11px;color:#9AA1AB;font-weight:500\">โครงการ / {{ screenCrumb }}<\u002Fdiv>\n        <div style=\"font-weight:700;font-size:18px;letter-spacing:-.01em\">{{ screenTitle }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ headerCatTabs }}\" as=\"ct\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ ct.onClick }}\" style=\"{{ ct.style }}\">{{ ct.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ notSchedule }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #ECEEF1;border-radius:9px;color:#6B7280;font-size:12.5px\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:#18935A\"><\u002Fspan>\n            Data Date · {{ dataDate }}\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ u.exportPdf }}\" style=\"display:flex;align-items:center;gap:7px;background:#fff;color:#4B515B;border:1px solid #ECEEF1;border-radius:9px;padding:9px 13px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\" style-hover=\"border:1px solid #D6DAE0;background:#FAFBFC\">\n            <span style=\"font-size:14px;line-height:1\">⤓<\u002Fspan> Export PDF\n          <\u002Fbutton>\n          <sc-if value=\"{{ canUpdate }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ u.openPicker }}\" style=\"display:flex;align-items:center;gap:8px;background:#3B5BDB;color:#fff;border:none;border-radius:9px;padding:9px 15px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(59,91,219,.3)\" style-hover=\"background:#2F49B8\">\n              <span style=\"font-size:15px;line-height:1\">＋<\u002Fspan> อัพเดทสถานะงาน\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isSchedule }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ sc.quickAdd }}\" style=\"display:flex;align-items:center;gap:8px;background:#3B5BDB;color:#fff;border:none;border-radius:9px;padding:9px 15px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(59,91,219,.3)\" style-hover=\"background:#2F49B8\">\n          <span style=\"font-size:15px;line-height:1\">＋<\u002Fspan> เพิ่มงานวันนี้\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fheader>\n\n    <!-- scroll content -->\n    <main class=\"app-main\" style=\"flex:1;overflow-y:auto;overflow-x:hidden\">\n      <div style=\"padding:28px;max-width:1320px;margin:0 auto\">\n\n        <!-- print-only report header -->\n        <div class=\"print-only\" style=\"margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #1B1F27\">\n          <div style=\"display:flex;align-items:flex-end;justify-content:space-between\">\n            <div>\n              <div style=\"font-size:12px;color:#6B7280;font-weight:600;letter-spacing:.05em\">PROJECT STATUS REPORT<\u002Fdiv>\n              <div style=\"font-weight:700;font-size:22px;margin-top:2px\">{{ projName }} · {{ projCode }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right;font-size:12px;color:#6B7280\">\n              <div style=\"font-weight:600;color:#1B1F27\">{{ screenTitle }}<\u002Fdiv>\n              <div>Data Date · {{ reportDate }} · สัปดาห์ {{ currentWeek }}/{{ totalWeeks }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============================ DASHBOARD ============================ -->\n        <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <!-- mode + layout switcher -->\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px\">\n              <div style=\"display:flex;gap:3px;background:#ECEEF1;padding:3px;border-radius:9px\">\n                <div sc-camel-on-click=\"{{ setMode.single }}\" style=\"{{ modeSingleStyle }}\">โครงการเดียว<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ setMode.all }}\" style=\"{{ modeAllStyle }}\">ทุกโครงการ<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ dashIsSingle }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:16px\">\n                  <div style=\"color:#6B7280;font-size:13px\">ภาพรวมสถานะ ณ {{ dataDate }} · สัปดาห์ที่ {{ currentWeek }}/{{ totalWeeks }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:3px;background:#ECEEF1;padding:3px;border-radius:9px\">\n                    <div sc-camel-on-click=\"{{ setLayout.A }}\" style=\"{{ layA.style }}\">Layout A<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ setLayout.B }}\" style=\"{{ layB.style }}\">Layout B<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ dashIsSingle }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n            <!-- KPI ROW -->\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px\">\n              <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n                <div style=\"background:#fff;border:1px solid #ECEEF1;border-radius:14px;padding:18px 18px 16px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n                    <div style=\"font:600 11px 'IBM Plex Sans Thai';letter-spacing:.05em;text-transform:uppercase;color:#9AA1AB\">{{ k.label }}<\u002Fdiv>\n                    <div style=\"width:28px;height:28px;border-radius:8px;background:{{ k.iconBg }};color:{{ k.iconColor }};display:flex;align-items:center;justify-content:center;font-size:14px\">{{ k.icon }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:baseline;gap:7px\">\n                    <div style=\"font-family:'IBM Plex Mono';font-weight:600;font-size:30px;letter-spacing:-.02em;color:{{ k.valColor }}\">{{ k.value }}<\u002Fdiv>\n                    <div style=\"font-size:13px;color:#9AA1AB\">{{ k.unit }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;color:{{ k.subColor }};margin-top:5px;font-weight:500\">{{ k.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- LAYOUT A -->\n            <sc-if value=\"{{ isLayoutA }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <div style=\"display:grid;grid-template-columns:1fr 340px;gap:16px;margin-bottom:16px\">\n                  <!-- S-curve card -->\n                  <div style=\"background:#fff;border:1px solid #ECEEF1;border-radius:14px;padding:20px\">\n                    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px\">\n                      <div>\n                        <div style=\"font-weight:700;font-size:15px\">S-Curve · แผนงานสะสม<\u002Fdiv>\n                        <div style=\"font-size:12px;color:#9AA1AB;margin-top:2px\">Planned vs Actual Cumulative Progress (%)<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ nav.scurve }}\" style=\"font-size:12px;color:#3B5BDB;font-weight:600;cursor:pointer\">ดูเต็ม →<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:18px;margin:10px 0 6px\">\n                      <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#6B7280\"><span style=\"width:18px;height:3px;border-radius:2px;background:#3B5BDB\"><\u002Fspan>Actual {{ overallActual }}%<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#6B7280\"><span style=\"width:18px;height:0;border-top:3px dotted #AEB6C2\"><\u002Fspan>Planned {{ plannedToDate }}%<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#6B7280\"><span style=\"width:18px;height:0;border-top:3px dashed #C2870C\"><\u002Fspan>Forecast<\u002Fdiv>\n                    <\u002Fdiv>\n                    {{ chartA }}\n                  <\u002Fdiv>\n                  <!-- overall ring + status -->\n                  <div st lid #ECEEF1;border-radius:14px;overflow:hidden\">\n              <div style=\"padding:18px 22px;border-bottom:1px solid #ECEEF1;font-weight:700;font-size:15px\">รายการแก้ไขแผน · Baseline Change Log <span style=\"color:#9AA1AB;font-weight:500;font-size:13px;margin-left:6px\">— {{ changedRows.length }} งานที่เลื่อน<\u002Fspan><\u002Fdiv>\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px\">\n                <sc-raw-thead>\n                  <sc-raw-tr style=\"color:#9AA1AB;text-align:left;background:#FAFBFC\">\n                    <sc-raw-th style=\"padding:11px 10px 11px 22px;font-weight:600;border-bottom:1px solid #ECEEF1\">WBS / งาน<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:11px 10px;font-weight:600;border-bottom:1px solid #ECEEF1\">Baseline เดิม<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:11px 10px;font-weight:600;border-bottom:1px solid #ECEEF1\">Baseline ใหม่<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:11px 10px;font-weight:600;border-bottom:1px solid #ECEEF1;text-align:center\">เลื่อน<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:11px 22px 11px 10px;font-weight:600;border-bottom:1px solid #ECEEF1\">เหตุผล<\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ changedRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                    <sc-raw-tr style=\"border-bottom:1px solid #F4F6F8\">\n                      <sc-raw-td style=\"padding:12px 10px 12px 22px;max-width:0\">\n                        <div style=\"display:flex;align-items:center;gap:10px\">\n                          <span style=\"font-family:'IBM Plex Mono';font-size:11px;color:#9AA1AB;flex:none\">{{ r.wbs }}<\u002Fspan>\n                          <span title=\"{{ r.th }}\" style=\"font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0\">{{ r.th }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;color:#6B7280;font-family:'IBM Plex Mono';font-size:12px\">{{ r.origTxt }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;font-family:'IBM Plex Mono';font-size:12px;font-weight:600\">{{ r.newTxt }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;text-align:center\"><span style=\"font-family:'IBM Plex Mono';font-weight:600;color:{{ r.shiftColor }}\">{{ r.shift }}<\u002Fspan><\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 22px 12px 10px;color:#4B515B\">{{ r.reason }}<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============================ UPDATE CENTER ============================ -->\n        <sc-if value=\"{{ isUpdate }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:380px 1fr;gap:16px\">\n            <!-- task picker -->\n            <div style=\"background:#fff;border:1px solid #ECEEF1;border-radius:14px;overflow:hidden;align-self:start\">\n              <div style=\"padding:16px 18px;border-bottom:1px solid #ECEEF1;font-weight:700;font-size:14px\">เลือกงานที่จะอัพเดท<\u002Fdiv>\n              <div style=\"max-height:620px;overflow-y:auto\">\n                <sc-for list=\"{{ taskRows }}\" as=\"it\" hint-placeholder-count=\"8\">\n                  <div sc-camel-on-click=\"{{ it.onSelect }}\" style=\"{{ it.pickStyle }}\" style-hover=\"background:#FAFBFC\">\n                    <span style=\"width:8px;height:8px;border-radius:50%;background:{{ it.stColor }};flex:none\"><\u002Fspan>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.th }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#9AA1AB\">{{ it.wbs }} · {{ it.owner }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-family:'IBM Plex Mono';font-size:12px;font-weight:600;color:{{ it.stColor }}\">{{ it.pct }}%<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <!-- form / impact -->\n            <sc-if value=\"{{ isEditing }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div style=\"background:#fff;border:1px solid #ECEEF1;border-radius:14px;padding:24px\">\n                  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px\">\n                    <span style=\"font-family:'IBM Plex Mono';font-size:12px;color:#9AA1AB\">{{ editing.wbs }}<\u002Fspan>\n                    <span style=\"{{ editing.badgeStyle }}\">{{ editing.stLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-weight:700;font-size:18px;letter-spacing:-.01em\">{{ editing.th }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#9AA1AB;margin-bottom:20px\">{{ editing.en }} · Baseline {{ editing.baseTxt }} · ผู้รับผิดชอบ {{ editing.owner }}<\u002Fdiv>\n\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">\n                    <label style=\"font-size:13px;font-weight:600\">ความคืบหน้า · % Complete<\u002Flabel>\n                    <div style=\"display:flex;align-items:baseline;gap:4px\"><span style=\"font-family:'IBM Plex Mono';font-weight:600;font-size:26px;color:#3B5BDB\">{{ draftPct }}<\u002Fspan><span style=\"color:#9AA1AB\">%<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <input type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ draftPct }}\" sc-camel-on-input=\"{{ u.onSlider }}\" style=\"width:100%;height:6px;cursor:pointer;margin-bottom:12px\">\n                  <div style=\"display:flex;gap:8px;margin-bottom:22px\">\n                    <sc-for list=\"{{ quickSteps }}\" as=\"q\" hint-placeholder-count=\"6\">\n                      <div sc-camel-on-click=\"{{ q.onClick }}\" style=\"{{ q.style }}\" style-hover=\"border:1px solid #3B5BDB;color:#3B5BDB\">{{ q.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px\">\n                    <div>\n                      <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">วันที่เริ่มจริง · Actual Start<\u002Flabel>\n                      <input type=\"date\" value=\"{{ draftStart }}\" sc-camel-on-input=\"{{ u.onStart }}\" style=\"width:100%;padding:9px 11px;border:1px solid #ECEEF1;border-radius:9px;font-family:inherit;font-size:13px;color:#1B1F27;background:#fff\">\n                    <\u002Fdiv>\n                    <div>\n                      <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">สถานะ · Status flag<\u002Flabel>\n                      <sc-raw-select value=\"{{ draftFlag }}\" sc-camel-on-change=\"{{ u.onFlag }}\" style=\"width:100%;padding:9px 11px;border:1px solid #ECEEF1;border-radius:9px;font-family:inherit;font-size:13px;color:#1B1F27;background:#fff\">\n                        <option value=\"auto\">อัตโนมัติ (ตามแผน)<\u002Foption>\n                        <option value=\"ontrack\">ตามแผน<\u002Foption>\n                        <option value=\"risk\">เสี่ยงล่าช้า<\u002Foption>\n                        <option value=\"late\">ล่าช้า / มีปัญหา<\u002Foption>\n                      <\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                  <\u คนที่เคยเข้าสู่ระบบ<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n                <sc-raw-thead>\n                  <sc-raw-tr style=\"background:#FAFBFC\">\n                    <sc-raw-th style=\"text-align:left;padding:10px 22px;font:600 11px 'IBM Plex Sans Thai';letter-spacing:.05em;text-transform:uppercase;color:#9AA1AB;border-bottom:1px solid #ECEEF1\">ชื่อ / อีเมล<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"text-align:left;padding:10px 16px;font:600 11px 'IBM Plex Sans Thai';letter-spacing:.05em;text-transform:uppercase;color:#9AA1AB;border-bottom:1px solid #ECEEF1;width:220px\">ตำแหน่ง<\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ userRows }}\" as=\"ur\" hint-placeholder-count=\"3\">\n                    <sc-raw-tr style=\"border-bottom:1px solid #F4F6F8\">\n                      <sc-raw-td style=\"padding:12px 22px\">\n                        <div style=\"font-weight:600;font-size:13px\">{{ ur.displayName }}<\u002Fdiv>\n                        <div style=\"font-size:12px;color:#9AA1AB\">{{ ur.emailAddr }}<\u002Fdiv>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:10px 16px\">\n                        <sc-raw-select value=\"{{ ur.role }}\" sc-camel-on-change=\"{{ ur.onChange }}\" disabled=\"{{ ur.locked }}\" style=\"width:100%;padding:8px 10px;border:1px solid #ECEEF1;border-radius:8px;font-family:inherit;font-size:12.5px;background:{{ ur.lockedBg }};cursor:{{ ur.lockedCursor }}\">\n                          <option value=\"admin\">ผู้ดูแลระบบ (Admin)<\u002Foption>\n                          <option value=\"exec\">ผู้บริหาร (Exec)<\u002Foption>\n                          <option value=\"pm\">Project Manager<\u002Foption>\n                          <option value=\"project_coordinator\">Project Coordinator<\u002Foption>\n                          <option value=\"senior_engineer\">Senior Engineer<\u002Foption>\n                          <option value=\"project_engineer\">Project Engineer<\u002Foption>\n                          <option value=\"system_engineer\">System Engineer<\u002Foption>\n                          <option value=\"network_engineer\">Network Engineer<\u002Foption>\n                          <option value=\"onsite_engineer\">Onsite Engineer<\u002Foption>\n                          <option value=\"technician\">Technician<\u002Foption>\n                          <option value=\"staff\">ทีมหน้างาน (Staff)<\u002Foption>\n                          <option value=\"client\">ลูกค้า/เจ้าของโครงการ (Client)<\u002Foption>\n                        <\u002Fsc-raw-select>\n                      <\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============================ 3-WEEK SCHEDULE ============================ -->\n        <sc-if value=\"{{ isSchedule }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <sc-if value=\"{{ scReady }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <!-- toolbar -->\n                <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <div sc-camel-on-click=\"{{ sc.prev }}\" style=\"width:32px;height:32px;border:1px solid #ECEEF1;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6B7280;font-size:14px\" style-hover=\"border:1px solid #D6DAE0;background:#FAFBFC\">‹<\u002Fdiv>\n                    <div style=\"text-align:center;min-width:174px\">\n                      <div style=\"font-weight:600;font-size:13.5px\">{{ scWeekLabel AB;cursor:pointer;font-size:18px;flex:none\" style-hover=\"background:#F1F3F5\">✕<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 24px;overflow-y:auto;flex:1\">\n          <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">โครงการ<\u002Flabel>\n          <sc-raw-select value=\"{{ scDraftProj }}\" sc-camel-on-change=\"{{ sc.onProj }}\" style=\"width:100%;padding:9px 11px;border:1px solid #ECEEF1;border-radius:9px;font-family:inherit;font-size:13px;background:#fff;margin-bottom:18px\">{{ scProjOptionsEl }}<\u002Fsc-raw-select>\n          <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">ผู้รับผิดชอบ<\u002Flabel>\n          <input list=\"sc-assignee-list\" value=\"{{ scDraftAssignee }}\" sc-camel-on-change=\"{{ sc.onAssignee }}\" placeholder=\"พิมพ์หรือเลือกชื่อ...\" style=\"width:100%;padding:9px 11px;border:1px solid #ECEEF1;border-radius:9px;font-family:inherit;font-size:13px;background:#fff;margin-bottom:18px;box-sizing:border-box\">\n          <datalist id=\"sc-assignee-list\">\n            <sc-for list=\"{{ scAssigneeOptions }}\" as=\"o\" hint-placeholder-count=\"0\"><option value=\"{{ o.name }}\"><\u002Foption><\u002Fsc-for>\n          <\u002Fdatalist>\n          <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">วัน<\u002Flabel>\n          <sc-raw-select value=\"{{ scDraftDay }}\" sc-camel-on-change=\"{{ sc.onDay }}\" style=\"width:100%;padding:9px 11px;border:1px solid #ECEEF1;border-radius:9px;font-family:inherit;font-size:13px;background:#fff;margin-bottom:18px\">{{ scDayOptionsEl }}<\u002Fsc-raw-select>\n          <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">รายละเอียดงาน<\u002Flabel>\n          <textarea value=\"{{ scDraftTitle }}\" sc-camel-on-input=\"{{ sc.onTitle }}\" placeholder=\"เช่น config &amp; install เขตจตุจักร...\" style=\"width:100%;min-height:78px;p กขั้นเดียว — วางคีย์ Supabase ลงในไฟล์<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#4B515B;line-height:1.7;margin-bottom:20px\">วางค่า 2 อย่างจาก Supabase (<b>Settings → API Keys<\u002Fb>) ลงในช่องด้านล่าง แล้วกดเชื่อมต่อ — ค่าจะถูกจำไว้ในเบราว์เซอร์นี้ ไม่ต้องแก้ไฟล์โค้ด<\u002Fdiv>\n        <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">Project URL<\u002Flabel>\n        <input type=\"text\" value=\"{{ cfgUrl }}\" sc-camel-on-input=\"{{ u.onCfgUrl }}\" placeholder=\"https://xxxx.supabase.co\" style=\"width:100%;padding:11px 13px;border:1px solid #ECEEF1;border-radius:9px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:15px;background:#fff\">\n        <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">anon public key<\u002Flabel>\n        <textarea value=\"{{ cfgKey }}\" sc-camel-on-input=\"{{ u.onCfgKey }}\" placeholder=\"eyJhbGciOiJI...\" style=\"width:100%;min-height:62px;padding:11px 13px;border:1px solid #ECEEF1;border-radius:9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-bottom:16px;background:#fff;resize:vertical;line-height:1.5;word-break:break-all\"><\u002Ftextarea>\n        <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#FBE9E7;color:#D6493B;font-size:12px;padding:10px 13px;border-radius:9px;margin-bottom:16px;line-height:1.45\">{{ authError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ u.saveCfg }}\" style=\"width:100%;background:#3B5BDB;color:#fff;border:none;border-radius:9px;padding:12px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 1px 2px rgba(59,91,219,.3)\" style-hover=\"background:#2F49B8\">เชื่อมต่อฐานข้อมูล<\u002Fbutton>\n        <div style=\"font-size:11px;color:#C2C8D0;text-align:center;margin-top:14px;line-height:1.5\">ค่านี้ปลอดเปิดเผยได้ (anon key) — ความปลอดภัยจริงอยู่ที่กฎ RLS ในฐานข้อมูล<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ GATE: LOGIN ============ -->\n  <sc-if value=\"{{ gate.login }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:90;background:linear-gradient(135deg,#EEF1F6,#E3E7EE);display:flex;align-items:center;justify-content:center;padding:24px;font-family:'IBM Plex Sans Thai',sans-serif\">\n      <div style=\"max-width:400px;width:100%;background:#fff;border:1px solid #ECEEF1;border-radius:16px;padding:34px 34px 30px;box-shadow:0 12px 50px rgba(27,31,39,.12)\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:24px\">\n          <div style=\"width:36px;height:36px;border-radius:10px;background:#3B5BDB;display:flex;align-items:center;justify-content:center;flex:none\">\n            <div style=\"width:16px;height:16px;border:2.5px solid #fff;border-radius:4px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-weight:700;font-size:16px;letter-spacing:-.01em\">PlanTrack<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#9AA1AB\">เข้าสู่ระบบเพื่อใช้งาน<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">อีเมล<\u002Flabel>\n        <input type=\"email\" value=\"{{ loginEmail }}\" sc-camel-on-input=\"{{ u.onEmail }}\" placeholder=\"you@company.com\" style=\"width:100%;padding:11px 13px;border:1px solid #ECEEF1;border-radius:9px;font-family:inherit;font-size:13.5px;margin-bottom:15px;background:#fff\">\n        <label style=\"font-size:12px;font-weight:600;color:#4B515B;display:block;margin-bottom:7px\">รหัสผ่าน<\u002Flabel>\n        <input type=\"password\" value=\"{{ loginPw }}\" sc-camel-on-input=\"{{ u.onPw }}\" sc-camel-on-key-down=\"{{ u.onPwKey }}\" placeholder=\"••••••••\" style=\"width:100%;padding:11px 13px;border:1px solid #ECEEF1;border-radius:9px;font-family:inherit;font-size:13.5px;margin-bottom:18px;background:#fff\">\n        <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#FBE9E7;color:#D6493B;font-size:12px;padding:10px 13px;border-radius:9px;margin-bottom:16px;line-height:1.45\">{{ authError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ u.signIn }}\" style=\"width:100%;background:#3B5BDB;color:#fff;border:none;border-radius:9px;padding:12px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 1px 2px rgba(59,91,219,.3)\" style-hover=\"background:#2F49B8\">{{ signInLabel }}<\u002Fbutton>\n        <div style=\"font-size:11px;color:#C2C8D0;text-align:center;margin-top:16px\">ผู้ดูแลสร้างบัญชีให้ใน Supabase → Authentication → Users<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ u.changeConn }}\" style=\"font-size:11px;color:#9AA1AB;text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline;text-underline-offset:2px\" style-hover=\"color:#3B5BDB\">เปลี่ยนการเชื่อมต่อฐานข้อมูล<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ GATE: LOADING ============ -->\n  <sc-if value=\"{{ gate.loading }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;inset:0;z-index:90;background:#F6F7F9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:'IBM Plex Sans Thai',sans-serif\">\n      <div style=\"width:38px;height:38px;border:3px solid #E2E5EA;border-top-color:#3B5BDB;border-radius:50%;animation:spin .8s linear infinite\"><\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#9AA1AB;font-weight:500\">กำลังโหลดข้อมูลโครงการ...<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  // ══════════════════════════════════════════════════════════════\n  //  วางค่า 2 บรรทัดนี้จาก Supabase → Settings → API Keys\n  //  (ขั้น 4 ในคู่มือ) แล้วบันทึกไฟล์ + รีเฟรชหน้าเว็บ\n  // ══════════════════════════════════════════════════════════════\n  SUPABASE_URL      = \"https://chkefmtnbbmpezkcieyu.supabase.co\";\n  SUPABASE_ANON_KEY = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoa2VmbXRuYmJtcGV6a2NpZXl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMDE2OTksImV4cCI6MjA5Nzc3NzY5OX0.MFi_TN-kaGAoIsU4qLcW26wxRS0iaCTc0HrXHEio3bc\";\n  // ══════════════════════════════════════════════════════════════\n\n  constructor(props){\n    super(props);\n    this.MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];\n    this.START=new Date(2026,3,6);\n    this.PHASES={A:'สำรวจ & ออกแบบ',B:'จัดซื้อ',C:'ติดตั้งโครงสร้าง',D:'ติดตั้งอุปกรณ์',E:'ตั้งค่า & ทดสอบ',F:'ส่งมอบ'};\n    this.state={\n      screen:'dashboard', layout:'A', totalWeeks:16, currentWeek:10,\n      drawerOpen:false, editingId:null,\n      draftPct:0, draftNote:'', draftStart:'', draftFlag:'auto',\n      toast:null,\n      phase:'init', me:null, authError:null, loginEmail:'', loginPw:'', signingIn:false, saving:false,\n      cfgUrl:'', cfgKey:'',\n      projects:[], selectedProjectId:null, projMenuOpen:false, dashMode:'all', allProjSummary:null,\n      npOpen:false, npSaving:false, npError:null,\n      np:{code:'',name:'',start:'',weeks:'12',durUnit:'weeks',category:'installation',rows:[]},\n      projCatFilter:'all',\n      epOpen:false, epSaving:false, epError:null,\n      ep:{id:null,code:'',name:'',start:'',weeks:'12',durUnit:'weeks',dataDate:'',ownerName:'',category:'installation',rows:[]},\n      delConfirm:null,\n      scWeek:1, scView:'focus', scPerson:null, scShowAll:false, scDraft:null,\n      activities:[], allUsers:[], teamMembers:[], scheduleReady:true,\n      projName:'โครงการ', projCode:'—',\n      actualHist:[null,2,6,13,21,30,38,46,52,56],\n      items:[\n        {id:'a1',wbs:'1.1',phase:'A',th:'สำรวจหน้างาน',en:'Site Survey',w:6,pct:100,bs:1,be:2,owner:'นภา',flag:'auto',budget:120000,acf:1.0},\n        {id:'a2',wbs:'1.2',phase:'A',th:'ออกแบบระบบ & BOQ',en:'System Design & BOQ',w:10,pct:100,bs:1,be:3,owner:'ธนา',flag:'auto',budget:280000,acf:1.05},\n        {id:'b1',wbs:'2.1',phase:'B',th:'สั่งซื้ออุปกรณ์หลัก',en:'Order Core Equipment',w:16,pct:100,bs:2,be:7,owner:'นภา',flag:'auto',budget:1650000,acf:1.08},\n        {id:'b2',wbs:'2.2',phase:'B',th:'จัดส่ง & ตรวจรับ',en:'Delivery & Inspection',w:8,pct:85,bs:6,be:8,owner:'นภา',flag:'auto',budget:180000,acf:1.0},\n        {id:'c1',wbs:'3.1',phase:'C',th:'เดินสาย & รางสาย',en:'Cabling & Trunking',w:14,pct:80,bs:4,be:9,owner:'สมชาย',flag:'auto',budget:520000,acf:1.12,o:[4,8],rev:'พบงานเดินสายเพิ่มชั้น 4'},\n        {id:'c2',wbs:'3.2',phase:'C',th:'ตู้ Rack & ระบบไฟ',en:'Rack & Power',w:8,pct:70,bs:5,be:9,owner:'สมชาย',flag:'auto',budget:340000,acf:0.98},\n        {id:'d1',wbs:'4.1',phase:'D',th:'ติดตั้งกล้อง/อุปกรณ์',en:'Device Mounting',w:10,pct:55,bs:8,be:12,owner:'สมชาย',flag:'auto',budget:480000,acf:1.05,o:[7,11],rev:'รออุปกรณ์ล็อต 2 เลื่อน 1 สัปดาห์'},\n        {id:'d2',wbs:'4.2',phase:'D',th:'ติดตั้ง Network & Server',en:'Network & Server',w:8,pct:45,bs:8,be:12,owner:'วีระ',flag:'auto',budget:620000,acf:1.0,o:[7,11],rev:'เลื่อนตามงานเดินสาย'},\n        {id:'e1',wbs:'5.1',phase:'E',th:'Configuration ระบบ',en:'System Configuration',w:8,pct:25,bs:11,be:14,owner:'วีระ',flag:'auto',budget:240000,acf:1.0,o:[10,13],rev:'เลื่อนตามงานติดตั้ง'},\n        {id:'e2',wbs:'5.2',phase:'E',th:'ทดสอบ & Commissioning',en:'Testing & Commissioning',w:6,pct:15,bs:13,be:15,owner:'วีระ',flag:'auto',budget:180000,acf:1.0,o:[12,14],rev:'เลื่อนตาม Configuration'},\n        {id:'f1',wbs:'6.1',phase:'F',th:'อบรมผู้ใช้งาน',en:'User Training',w:3,pct:0,bs:15,be:16,owner:'ธนา',flag:'auto',budget:90000,acf:1.0,o:[14,15],rev:'เลื่อนส่งมอบตามแผนรวม'},\n        {id:'f2',wbs:'6.2',phase:'F',th:'ส่งมอบเอกสาร',en:'Documentation & Handover',w:3,pct:0,bs:15,be:16,owner:'ธนา',flag:'auto',budget:100000,acf:1.0,o:[14,15],rev:'เลื่อนส่งมอบตามแผนรวม'},\n      ],\n      activity:[\n        {id:1,who:'สมชาย',wbs:'3.1',name:'เดินสาย & รางสาย',from:65,to:80,note:'เดินสายชั้น 3 เสร็จ รอตรวจรับ',time:'2 ชม.ที่แล้ว'},\n        {id:2,who:'นภา',wbs:'2.2',name:'จัดส่ง & ตรวจรับ',from:70,to:85,note:'ของล็อต 2 มาครบ ตรวจผ่าน',time:'เมื่อวานนี้'},\n        {id:3,who:'วีระ',wbs:'4.2',name:'Network & Server',from:30,to:45,note:'ติดตั้ง core switch แล้ว',time:'เมื่อวานนี้'},\n        {id:4,who:'สมชาย',wbs:'4.1',name:'ติดตั้งกล้อง',from:48,to:55,note:'ชั้น 2 ครบ 24 จุด',time:'2 วันก่อน'},\n      ],\n    };\n  }\n\n  // ══════════════════ Supabase / Auth ══════════════════\n  getCfg(){\n    try{ const r=localStorage.getItem('plantrack_cfg'); if(r){ const o=JSON.parse(r); if(o&&o.url&&o.key) return o; } }catch(e){}\n    if(this.SUPABASE_URL&&this.SUPABASE_URL.startsWith('https://')&&!this.SUPABASE_URL.includes('PASTE')&&this.SUPABASE_ANON_KEY&&this.SUPABASE_ANON_KEY.length>30)\n      return {url:this.SUPABASE_URL,key:this.SUPABASE_ANON_KEY};\n    return null;\n  }\n  async waitForLib(){\n    for(let i=0;i<60;i++){ if(window.supabase&&window.supabase.createClient) return true; await new Promise(r=>setTimeout(r,150)); }\n    return !!(window.supabase&&window.supabase.createClient);\n  }\n  async componentDidMount(){\n    const cfg=this.getCfg();\n    if(!cfg){ this.setState({phase:'config'}); return; }\n    this.connect(cfg);\n  }\n  async connect(cfg){\n    const ok=await this.waitForLib();\n    if(!ok){ this.setState({phase:'login',authError:'โหลดไลบรารี Supabase ไม่สำเร็จ — ตรวจการเชื่อมต่ออินเทอร์เน็ต'}); return; }\n    try{ this.sb=window.supabase.createClient(cfg.url,cfg.key); }\n    catch(e){ this.setState({phase:'config',authError:'URL หรือคีย์ไม่ถูกต้อง'}); return; }\n    try{\n      const { data:{ session } }=await this.sb.auth.getSession();\n      if(session&&session.user){ await this.afterLogin(session.user); return; }\n    }catch(e){}\n    this.setState({phase:'login'});\n  }\n  saveCfg(){\n    let url=(this.state.cfgUrl||'').trim();\n    const m=url.match(/https:\\/\\/[a-z0-9-]+\\.supabase\\.co/i);  // ตัด /rest/v1/ หรือ path อื่นออกอัตโนมัติ\n    if(m) url=m[0];\n    url=url.replace(/\\/+$/,'');\n    const key=(this.state.cfgKey||'').trim();\n    if(!url.startsWith('https://')||!url.includes('.supabase.co')){ this.setState({authError:'Project URL ต้องขึ้นต้น https:// และลงท้าย .supabase.co'}); return; }\n    if(key.length<30){ this.setState({authError:'anon key สั้นเกินไป — คัดลอกคีย์ให้ครบ'}); return; }\n    try{ localStorage.setItem('plantrack_cfg',JSON.stringify({url,key})); }catch(e){}\n    this.setState({authError:null,phase:'loading'});\n    this.connect({url,key});\n  }\n  clearCfg(){\n    try{ localStorage.removeItem('plantrack_cfg'); }catch(e){}\n    this.setState({phase:'config',me:null,cfgUrl:'',cfgKey:'',authError:null});\n  }\n  async signIn(){\n    if(!this.state.loginEmail||!this.state.loginPw) return;\n    this.setState({signingIn:true,authError:null});\n    try{\n      const { data,error }=await this.sb.auth.signInWithPassword({email:this.state.loginEmail.trim(),password:this.state.loginPw});\n      if(error){ this.setState({signingIn:false,authError:this.authMsg(error.message)}); return; }\n      await this.afterLogin(data.user);\n      this.setState({signingIn:false,loginPw:''});\n    }catch(e){ this.setState({signingIn:false,authError:String(e.message||e)}); }\n  }\n  async signOut(){\n    try{ await this.sb.auth.signOut(); }catch(e){}\n    this.setState({phase:'login',me:null,loginEmail:'',loginPw:''});\n  }\n  authMsg(m){\n    if(/Invalid login/i.test(m)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';\n    if(/Email not confirmed/i.test(m)) return 'อีเมลยังไม่ยืนยัน — ปิด Confirm email ใน Supabase หรือยืนยันก่อน';\n    return m;\n  }\n  async afterLogin(user){\n    this.setState({phase:'loading'});\n    let me={id:user.id,email:user.email,name:user.email,role:'staff'};\n    try{\n      const { data:urow }=await this.sb.from('users').select('full_name,global_role').eq('id',user.id).maybeSingle();\n      if(urow){ me.name=urow.full_name||user.email; me.role=urow.global_role||'staff'; }\n    }catch(e){}\n    this._me=me;\n    try{\n      await this.loadData();\n      this.setState({phase:'app',me});\n      if(this.state.dashMode==='all') this.loadAllProjectsAggregate();\n    }catch(e){\n      this.setState({phase:'login',authError:'โหลดข้อมูลไม่สำเร็จ: '+String(e.message||e)});\n    }\n  }\n  relTime(ts){\n    const d=new Date(ts), now=new Date(), m=Math.round((now-d)/60000);\n    if(m<1) return 'เมื่อสักครู่';\n    if(m<60) return m+' นาทีที่แล้ว';\n    const h=Math.round(m/60); if(h<24) return h+' ชม.ที่แล้ว';\n    const dd=Math.round(h/24); return dd===1?'เมื่อวานนี้':dd+' วันก่อน';\n  }\n  weekEnd(w){ const d=new Date(this.START); d.setDate(d.getDate()+(w*7-1)); return d; }\n  taskPctAtWeek(it,w,ups){\n    const we=this.weekEnd(w), list=ups[it.id];\n    if(list&&list.length){ let p=null; for(const u of list){ if(u.t<=we) p=u.pct; else break; } return p==null?0:p; }\n    return it.pct*this.pFrac(it,w); // ไม่มีประวัติ → ประมาณตามแผน\n  }\n  rebuildActualHist(ups){\n    const TW=this.state.totalWeeks, arr=[null];\n    for(let w=1;w<=TW;w++){\n      arr[w]=Math.round(this.state.items.reduce((s,it)=>s+it.w*this.taskPctAtWeek(it,w,ups)/100,0));\n    }\n    this.state.actualHist=arr;\n  }\n  async loadData(){\n    const sb=this.sb;\n    const { data:projects,error:pe }=await sb.from('projects').select('*').order('code');\n    if(pe) throw pe;\n    if(!projects||!projects.length) throw new Error('ยังไม่มีโครงการ — รัน SQL ข้อมูลตัวอย่าง (ขั้น 2) ก่อน');\n    const proj=projects.find(p=>p.id===this.state.selectedProjectId)||projects[0];\n    this.state.projects=projects;\n    this.state.selectedProjectId=proj.id;\n    const start=new Date(proj.start_date), dataDate=new Date(proj.data_date);\n    const DAY=864e5, TW=proj.total_weeks;\n    const curWeek=Math.min(TW,Math.max(1,Math.round((dataDate-start)/(7*DAY))+1));\n    const [phasesR,tasksR,baseR,costsR,progAllR,progFeedR]=await Promise.all([\n      sb.from('phases').select('*').eq('project_id',proj.id).order('sort_order'),\n      sb.from('tasks').select('*, owner:owner_id(full_name)').eq('project_id',proj.id),\n      sb.from('baselines').select('*').eq('project_id',proj.id).order('version'),\n      sb.from('cost_entries').select('task_id,amount'),\n      sb.from('progress_updates').select('task_id,pct_to,created_at,actual_start').order('created_at',{ascending:true}),\n      sb.from('progress_updates').select('*, usr:user_id(full_name), tsk:task_id(wbs_code,name_th)').order('created_at',{ascending:false}).limit(12),\n    ]);\n    const taskIds=(tasksR.data||[]).map(t=>t.id);\n    const bitemsR=taskIds.length>0 ? await sb.from('baseline_items').select('*').in('task_id',taskIds) : {data:[]};\n    const phases=phasesR.data||[], tasks=tasksR.data||[], baselines=baseR.data||[];\n    const bitems=bitemsR.data||[], costs=costsR.data||[], progAll=progAllR.data||[], feed=progFeedR.data||[];\n    const PHASES={}, phaseById={}; phases.forEach(p=>{PHASES[p.code]=p.name; phaseById[p.id]=p.code;});\n    const curBase=baselines.find(b=>b.is_current)||baselines[baselines.length-1]||null;\n    const origBase=(baselines.find(b=>!b.is_current))||baselines[0]||null;\n    const weekOf=d=>{ const w=Math.round((new Date(d)-start)/(7*DAY))+1; return Math.min(TW,Math.max(1,w)); };\n    const costByTask={}; costs.forEach(c=>{costByTask[c.task_id]=(costByTask[c.task_id]||0)+Number(c.amount);});\n    const curB={}, origB={};\n    bitems.forEach(bi=>{ if(curBase&&bi.baseline_id===curBase.id) curB[bi.task_id]=bi; if(origBase&&bi.baseline_id===origBase.id) origB[bi.task_id]=bi; });\n    const actualDates={}; progAll.forEach(p=>{ if(p.actual_start) actualDates[p.task_id]=p.actual_start; });\n    const items=tasks.map(t=>{\n      const cb=curB[t.id], ob=origB[t.id];\n      const bs=cb?we ;return d;}\n  fmt(d){return d.getDate()+' '+this.MONTHS[d.getMonth()]+' '+String((d.getFullYear()+543)%100).padStart(2,'0');}\n  fmtW(w){return this.fmt(this.weekDate(w));}\n  fmtSlash(iso){ if(!iso)return '—'; const d=new Date(String(iso).slice(0,10)+'T00:00:00'); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String((d.getFullYear()+543)%100).padStart(2,'0'); }\n  pFrac(it,w){const dur=it.be-it.bs+1;return Math.max(0,Math.min(1,(w-it.bs+1)/dur));}\n  plannedCum(w){return this.state.items.reduce((s,it)=>s+it.w*this.pFrac(it,w),0);}\n  actualWith(items){return items.reduce((s,it)=>s+it.w*it.pct,0)/100;}\n  statusOf(it){\n    const pi=this.pFrac(it,this.state.currentWeek)*100;\n    if(it.flag&&it.flag!=='auto') return it.flag;\n    if(it.pct>=100) return 'done';\n    if(it.pct<=0) return it.bs<=this.state.currentWeek?'late':'pending';\n    if(it.pct<pi-10) return 'risk';\n    if(it.pct>pi+8) return 'ahead';\n    return 'ontrack';\n  }\n  stMeta(s){\n    const m={\n      done:{label:'เสร็จแล้ว',color:'#18935A',bg:'#E7F4EE'},\n      ontrack:{label:'ตามแผน',color:'#3B5BDB',bg:'#EAEEFC'},\n      ahead:{label:'เร็วกว่าแผน',color:'#0E7C86',bg:'#E2F2F3'},\n      risk:{label:'เสี่ยงล่าช้า',color:'#C2870C',bg:'#FBF1DC'},\n      late:{label:'ล่าช้า',color:'#D6493B',bg:'#FBE9E7'},\n      pending:{label:'ยังไม่เริ่ม',color:'#6B7280',bg:'#EEF0F3'},\n    };\n    return m[s]||m.pending;\n  }\n  badgeStyle(m){return `display:inline-block;background:${m.bg};color:${m.color};font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap`;}\n  money(n){return '฿'+Math.round(n).toLocaleString('en-US');}\n  moneyM(n){return '฿'+(n/1e6).toFixed(2)+'M';}\n\n  // ---------- chart ----------\n  chart(){\n    const TW=this.state.totalWeeks, cur=this.state.currentWeek;\n    const W=1040,H=420,padL=50,padR=18,padT=22,padB=44;\n    const plotW=W-padL-padR, plotH=H-padT-padB;\n    const xFor=w=>padL+((w-1)/(TW-1))*plotW;\n    const yFor=p=>padT+(1-p/100)*plotH;\n    const planned=[]; for(let w=1;w<=TW;w++)planned.push(this.plannedCum(w));\n    const actNow=this.actualWith(this.state.items);\n    const actual=[]; for(let w=1;w<=cur;w++)actual.push(w<cur?this.state.actualHist[w]:actNow);\n    const path=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');\n    const planPts=planned.map((p,i)=>[xFor(i+1),yFor(p)]);\n    const actPts=actual.map((p,i)=>[xFor(i+1),yFor(p)]);\n    const rate=actNow/cur;\n    const projEnd=Math.min(100,actNow+rate*(TW-cur));\n    const fcPts=[[xFor(cur),yFor(actNow)],[xFor(TW),yFor(projEnd)]];\n    const planToDate=this.plannedCum(cur);\n    const behind=actNow<planToDate;\n    const areaPts=actPts.concat(planPts.slice(0,cur).reverse());\n    return {\n      planPath:path(planPts), actualPath:path(actPts), forecastPath:path(fcPts),\n      areaPath:path(areaPts)+' Z', areaFill: behind?'rgba(214,73,59,.07)':'rgba(24,147,90,.07)',\n      todayX:xFor(cur).toFixed(1), curX:xFor(cur).toFixed(1), curY:yFor(actNow).toFixed(1),\n      yTicks:[0,25,50,75,100].map(v=>({y:yFor(v).toFixed(1),ty:(yFor(v)+4).toFixed(1),label:v+'%'})),\n      xTicks:[1,4,7,10,13,16].filter(w=>w<=TW).map(w=>({x:xFor(w).toFixed(1),label:this.fmtW(w)})),\n    };\n  }\n  chartSvg(c){\n    const e=React.createElement;\n    const grid=[];\n    c.yTicks.forEach((t,i)=>{\n      grid.push(e('line',{key:'yl'+i,x1:50,x2:1022,y1:t.y,y2:t.y,stroke:'#F1F3F5','strokeWidth':1}));\n      grid.push(e('text',{key:'yt'+i,x:40,y:t.ty,textAnchor:'end',style:{font:\"500 13px 'IBM Plex Mono'\",fill:'#9AA1AB'}},t.label));\n    });\n    c.xTicks.forEach((t,i)=>grid.push(e('text',{key:'xt'+i,x:t.x,y:406,textAnchor:'middle',style:{font:\"500 12px 'IBM Plex Mono'\",fill:'#9AA1AB'}},t.label)));\n    return e('svg',{viewBox:'0 0 1040 420',style:{width:'100%',height:'auto',display:'block',overflow:'visible'}},\n      grid,\n      e('path',{d:c.areaPath,fill:c.areaFill,stroke:'none'}),\n      e('path',{d:c.planPath,fill:'none',stroke:'#AEB6C2','strokeWidth':2.5,'strokeDasharray':'2 6','strokeLinecap':'round',vectorEffect:'non-scaling-stroke'}),\n      e('path',{d:c.forecastPath,fill:'none',stroke:'#C2870C','strokeWidth':2,'strokeDasharray':'6 5',vectorEffect:'non-scaling-stroke'}),\n      e('path',{d:c.actualPath,fill:'none',stroke:'#3B5BDB','strokeWidth':3,'strokeLinecap':'round','strokeLinejoin':'round',vectorEffect:'non-scaling-stroke'}),\n      e('line',{x1:c.todayX,x2:c.todayX,y1:22,y2:376,stroke:'#3B5BDB','strokeWidth':1,'strokeDasharray':'3 4',opacity:.4}),\n      e('circle',{cx:c.curX,cy:c.curY,r:5,fill:'#3B5BDB',stroke:'#fff','strokeWidth':2.5})\n    );\n  }\n\n  // ---------- handlers ----------\n  go(s){this.setState({screen:s}); if(s==='dashboard') this.setDashMode('all');}\n  openDrawer(id){if(!this.canUpdate())return;const it=this.state.items.find(x=>x.id===id);this.setState({editingId:id,draftPct:it.pct,draftNote:'',draftStart:'',draftFlag:it.flag||'auto',drawerOpen:true});}\n  selectUpdate(id){const it=this.state.items.find(x=>x.id===id);this.setState({editingId:id,draftPct:it.pct,draftNote:'',draftStart:'',draftFlag:it.flag||'auto',drawerOpen:false});}\n  async save(){\n    const it=this.state.items.find(x=>x.id===this.state.editingId);\n    if(!it||this.state.saving)return;\n    const from=it.pct, to=this.state.draftPct;\n    this.setState({saving:true});\n    try{\n      const flag=this.state.draftFlag;\n      const { error:e1 }=await this.sb.from('progress_updates').insert({\n        task_id:it.id, user_id:this._me.id, pct_from:from, pct_to:to,\n        actual_start:this.state.draftStart||null, status_flag:flag, note:this.state.draftNote||null });\n      if(e1) throw e1;\n      const { error:e2 }=await this.sb.from('tasks').update({current_pct:to,status_flag:flag}).eq('id',it.id);\n      if(e2) throw e2;\n      await this.loadData();\n      this.setState({saving:false,drawerOpen:false,editingId:null,toast:`บันทึก ${it.wbs} ${it.th} เป็น ${to}% แ
